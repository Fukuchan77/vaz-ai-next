name: eval-nightly

# Manual dispatch only. This workflow drives the golden set against a *real*
# model on every firing, so a nightly cron spent provider credits whether or not
# anything had changed since the last run. The daily scheduled slot now belongs
# to security-daily.yml (dependency audit only); run this one by hand — from the
# Actions tab or `gh workflow run eval-nightly.yml` — before a release or after a
# prompt/model/tool change that could move the golden-set scores. The workflow
# name and `eval:nightly` script keep their names to stay aligned with
# `packages/evals/src/nightly.ts`'s vocabulary.
on:
  workflow_dispatch: {}

# Auto-cancel overlapping runs on the same branch (e.g. manual dispatch racing the schedule).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # GitHub Secrets gate (R4.6): without a provider API key (ANTHROPIC_API_KEY
      # for the default AI_PROVIDER=anthropic) — e.g. runs from a fork — real models
      # cannot be called, so skip the following steps (treated as not-run, not failed).
      # NOTE: a job-level `if` cannot reference the `secrets` context (it is a
      # workflow-file validation error that leaves a failure record on every push),
      # so gate via a step-level output instead.
      - name: Gate on provider API key
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured — skipping nightly eval."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'

      - uses: jdx/mise-action@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.enabled == 'true'

      - name: Install Dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Nightly Eval
        # `packages/evals/src/nightly.ts` runs the golden set, enforces the cost cap,
        # and checks for score regressions, exiting non-zero on detected regressions
        # (R4.6). This step only wires the secrets through and allows the cost cap to
        # be overridden via a repository variable.
        #
        # Tier2 (Req 5.2, faithfulness/relevancy via `services/agent`) rides the same
        # step and the same provider-key gate above — no separate CI-level gate is
        # added. `nightly.ts#resolveTier2BaseUrlFromEnv` treats an unset/blank
        # `AGENT_SERVICE_URL` as "tier2 disabled" and skips it for the whole run
        # (never fails), so leaving the repository variable unset is sufficient to
        # keep this step's behavior unchanged.
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm --filter @vaz/evals run eval:nightly
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          EVAL_NIGHTLY_COST_CAP_TOKENS: ${{ vars.EVAL_NIGHTLY_COST_CAP_TOKENS }}
          AGENT_SERVICE_URL: ${{ vars.AGENT_SERVICE_URL }}
