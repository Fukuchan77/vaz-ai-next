name: tests

# Runner-usage budget: `main` + pull requests only (same rationale as lint.yml) —
# the pre-commit hook already runs vitest and `pnpm audit` on every commit.
on:
  push:
    branches: [main]
  pull_request:

# Auto-cancel stale runs when new pushes land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vitest run --coverage

  # Independent of `unit` so an advisory failure never hides unit test results
  # (see docs/dependency-policy.md for the response runbook).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=moderate

  # NOTE: there is deliberately no `e2e` job here. Playwright E2E is owned by the
  # pre-push hook (.githooks/pre-push), which additionally runs the real chat
  # round-trip against a local Ollama when one is reachable — something a hosted
  # runner cannot do without pulling a multi-GB model on every run. Running the
  # browser matrix (chromium + firefox, in the Playwright container image, after a
  # full `next build`) was by far this repo's most expensive job, so it moved to the
  # developer machine where the Ollama-backed variant is free. Consequence: a push
  # made with `--no-verify` gets no E2E coverage at all — see README's CI section.

  # Sole required status check (branch protection targets this job, not the
  # individual jobs above) so `unit`/`audit` can stay independent and visible
  # even when one of them fails.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [unit, audit]
    if: always()

    steps:
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "unit=${{ needs.unit.result }} audit=${{ needs.audit.result }}"
            exit 1
          fi
