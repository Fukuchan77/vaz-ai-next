name: tests

on: push

# Auto-cancel stale runs when new pushes land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=moderate

      - name: Test
        run: pnpm exec vitest run --coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browser downloads from the Playwright CDN stall on the runner, so run in the
    # official browser-bundled image (no download needed at all). Keep the image
    # tag in sync with the @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # The E2E webServer (CI) runs `next start` for @vaz/web, so build the same
        # target: @vaz/web is the artifact.
        run: pnpm --filter @vaz/web run build

      - name: E2E Tests
        run: pnpm exec playwright test
        env:
          # Needed to launch Firefox inside the container (GH Actions sets HOME to /github/home).
          HOME: /root
