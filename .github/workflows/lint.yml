name: lint

on: push

# Auto-cancel stale runs when new pushes land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Model-ID gate (R1.8/ADR-5): plain grep, needs no install — fail fast
      # before the pnpm setup steps.
      - name: Model-ID gate
        run: bash scripts/forbid-model-ids.sh

      - uses: jdx/mise-action@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Type Check
        run: pnpm -r run typecheck
