name: lint

# Runner-usage budget: fires on `main` and on pull requests only — NOT on every
# push to a feature branch. The pre-commit hook (.githooks/pre-commit) already
# runs biome + tsc + vitest + audit + the model-ID gate locally, so intermediate
# pushes have nothing left for this workflow to catch; PR + main keeps the
# authoritative machine-side verification before anything merges.
on:
  push:
    branches: [main]
  pull_request:

# Auto-cancel stale runs when new pushes land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (X-1): this job only checks out and reads the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Model-ID gate (R1.8/ADR-5): plain grep, needs no install — fail fast
      # before the pnpm setup steps.
      - name: Model-ID gate
        run: bash scripts/forbid-model-ids.sh

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Type Check
        run: pnpm -r run typecheck
