[project]
name = "vaz-agent-service"
version = "0.1.0"
description = "Stateless Python sidecar: RAG evaluation (faithfulness/relevancy) and structure-preserving parsing"
requires-python = ">=3.13"
# Floors are raised whenever the resolved version crosses a breaking boundary —
# a new major, or (for 0.x projects, where the minor carries breaking changes) a
# new minor. Same-major drift is left alone so the floors stay permissive.
dependencies = [
	"fastapi>=0.141",
	"pydantic>=2.9",
	"pydantic-settings>=2.6",
	"pydantic-ai-slim[anthropic,openai]>=2.27",
	"llama-index-core>=0.14",
	"uvicorn[standard]>=0.52",
	"httpx>=0.28",
	"docling>=2.113.0",
	"docling-core[chunking]>=2.87.1",
	"llama-cloud>=2.11.0",
	"python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
	"pytest>=9.1",
	"pytest-asyncio>=1.4",
	"ruff>=0.16",
	"pyright>=1.1",
	"pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# [tool.uv] package = false means `uv sync` never installs this project into the
# venv, so `tests/conftest.py`'s `from app...` imports have no path to `app/`
# unless the invoking shell happens to carry rootdir on PYTHONPATH already.
# `pythonpath = ["."]` (pytest 7+ built-in, no plugin needed) adds rootdir to
# sys.path regardless of the caller's environment.
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern calls Depends()/Query()/etc. in argument defaults by
# design; B008 would otherwise flag every route parameter (Req 2.2).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
