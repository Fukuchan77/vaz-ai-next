[project]
name = "vaz-agent-service"
version = "0.1.0"
description = "Stateless Python sidecar: RAG evaluation (faithfulness/relevancy) and structure-preserving parsing"
requires-python = ">=3.13"
dependencies = [
	"fastapi>=0.115",
	"pydantic>=2.9",
	"pydantic-settings>=2.6",
	"pydantic-ai-slim[anthropic,openai]>=0.0.14",
	"llama-index-core>=0.14",
	"uvicorn[standard]>=0.32",
	"httpx>=0.27",
	"docling>=2.113.0",
	"docling-core[chunking]>=2.87.1",
	"llama-cloud>=2.11.0",
	"python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
	"pytest>=8.3",
	"pytest-asyncio>=0.24",
	"ruff>=0.7",
	"pyright>=1.1",
	"pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern calls Depends()/Query()/etc. in argument defaults by
# design; B008 would otherwise flag every route parameter (Req 2.2).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
