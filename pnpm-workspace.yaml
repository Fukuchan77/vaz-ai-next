# pnpm ワークスペース定義 + サプライチェーン対策を集約するファイル。
# 本リポジトリは apps/* + packages/* のモノレポ構成(001-vaz-ai-update Phase 1)。

# ワークスペースメンバー: アプリ(apps/*)と共有パッケージ(packages/*)。
# glob が現時点で空でも pnpm はエラーにしない(メンバー追加前から解決可能)。
packages:
  - "apps/*"
  - "packages/*"

# 公開から 24 時間(1440 分)未満の新規バージョンを解決しない。
# npm への不正パッケージ公開直後(検出・取り下げ前)の最危険期間を回避する。
# 緊急のセキュリティパッチを例外にしたい場合は minimumReleaseAgeExclude を使う。
minimumReleaseAge: 1440

# 推移的依存の脆弱性を最小限のパッチで固定する(pnpm audit の指摘に対応)
# - postcss: next が固定する 8.4.31 に XSS(GHSA-qx2v-qp2m-jg93)。8.5.10 以上へ
overrides:
  "postcss@<8.5.10": "^8.5.15"

# 依存の install/postinstall スクリプトは pnpm がデフォルトでブロックする。
# pnpm 11 の allowBuilds で、監査済みの判断を明示的に記録する(false = 実行拒否):
# - @carbon/* / @ibm/plex*: スクリプトは ibmtelemetry(テレメトリ収集)のみ
# - @parcel/watcher: optionalDependencies のビルド済みバイナリで動作する
# - sharp: プリビルドバイナリ(@img/sharp-*)で動作する。next/image の画像最適化で
#   ネイティブビルドが必要になった場合のみ true へ変更を検討する。
# - pg (Phase 2 RAG DB ドライバ, R2.2 / Task 8.6): 現行 pg@8.22 は lifecycle build script を
#   持たない(audited: scripts は "test" のみ。依存ツリー pgpass/pg-pool/pg-types/pg-protocol/
#   pg-connection-string/pg-cloudflare も純 JS、native な pg-native は不使用)。したがって
#   strictDepBuilds(既定 true)下でも install はブロックされないが、default-deny を明示記録し、
#   将来版が install script を追加した場合のフェイルセーフとして false を宣言する
#   (dependency としての追加は 9.x の ingest/retrieve 実装)。
# スクリプト実行を許可する場合は該当エントリを true にする(要監査)。
allowBuilds:
  "@carbon/colors": false
  "@carbon/feature-flags": false
  "@carbon/grid": false
  "@carbon/icon-helpers": false
  "@carbon/icons-react": false
  "@carbon/layout": false
  "@carbon/motion": false
  "@carbon/react": false
  "@carbon/styles": false
  "@carbon/themes": false
  "@carbon/type": false
  "@carbon/utilities": false
  "@ibm/plex": false
  "@ibm/plex-mono": false
  "@ibm/plex-sans": false
  "@ibm/plex-sans-arabic": false
  "@ibm/plex-sans-devanagari": false
  "@ibm/plex-sans-hebrew": false
  "@ibm/plex-sans-thai": false
  "@ibm/plex-sans-thai-looped": false
  "@ibm/plex-serif": false
  "@parcel/watcher": false
  # inngest (Phase 3 耐久エンジン SDK / Task 13.9): published パッケージに install
  # script は無い(dev の release/build のみ)。失敗時フェイルセーフとして default-deny 記録。
  inngest: false
  pg: false
  # protobufjs (inngest Connect gateway の protobuf 層の推移的依存 / Task 13.9):
  # postinstall は CLI ヘルパ(pbjs/pbts)の bundle 生成のみで、**ランタイムの protobuf は
  # スクリプト無しで動作**する(inngest Connect の WS メッセージ用途は runtime API のみ)。
  # よって default-deny(false)で安全 ―― CLI が必要になった場合のみ true を検討する。
  protobufjs: false
  # redis (node-redis, Phase 3 JobEvent pub/sub / Task 13.8): 現行 redis@6.1.0 は
  # lifecycle build script を持たない(published scripts は "release" のみ; 依存 @redis/*
  # も純 JS)。strictDepBuilds 下でも install はブロックされないが、pg と同様に
  # default-deny を明示記録し、将来版が install script を追加した場合のフェイルセーフとする
  # (実接続は 13.9 の start.ts で createClient、publisher.ts は構造 seam で非 import)。
  redis: false
  sharp: false
