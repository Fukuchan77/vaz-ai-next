# pnpm workspace definition + supply-chain hardening, in one file.
# This repo is an apps/* + packages/* monorepo (001-vaz-ai-update, Phase 1).

# Workspace members: apps (apps/*) and shared packages (packages/*).
# pnpm does not error on an empty glob (it resolves before any member is added).
packages:
  - "apps/*"
  - "packages/*"

# Do not resolve any version published less than 24 hours (1440 minutes) ago.
# This avoids the highest-risk window right after a malicious npm publish (before
# detection/takedown). Use minimumReleaseAgeExclude for an urgent security patch.
minimumReleaseAge: 1440

# Pin transitive-dependency vulnerabilities with the minimal patch (per pnpm audit).
# - postcss: 8.4.31 (pinned by next) has an XSS (GHSA-qx2v-qp2m-jg93); bump to 8.5.10+.
overrides:
  "postcss@<8.5.10": "^8.5.15"

# pnpm blocks dependency install/postinstall scripts by default.
# allowBuilds (pnpm 11) records the audited decision explicitly (false = deny):
# - @carbon/* / @ibm/plex*: the only script is ibmtelemetry (telemetry collection).
# - @parcel/watcher: works from prebuilt binaries in optionalDependencies.
# - sharp: works from prebuilt binaries (@img/sharp-*). Only consider flipping to
#   true if next/image optimization ever needs a native build.
# - pg (Phase 2 RAG DB driver, R2.2): pg@8.22 has no lifecycle build script
#   (audited: scripts is "test" only; the pgpass/pg-pool/pg-types/pg-protocol/
#   pg-connection-string/pg-cloudflare tree is pure JS, native pg-native unused).
#   So install is not blocked even under strictDepBuilds (default true), but we
#   record default-deny explicitly as a fail-safe should a future version add an
#   install script.
# To permit a script, flip the relevant entry to true (requires an audit).
allowBuilds:
  "@carbon/colors": false
  "@carbon/feature-flags": false
  "@carbon/grid": false
  "@carbon/icon-helpers": false
  "@carbon/icons-react": false
  "@carbon/layout": false
  "@carbon/motion": false
  "@carbon/react": false
  "@carbon/styles": false
  "@carbon/themes": false
  "@carbon/type": false
  "@carbon/utilities": false
  "@ibm/plex": false
  "@ibm/plex-mono": false
  "@ibm/plex-sans": false
  "@ibm/plex-sans-arabic": false
  "@ibm/plex-sans-devanagari": false
  "@ibm/plex-sans-hebrew": false
  "@ibm/plex-sans-thai": false
  "@ibm/plex-sans-thai-looped": false
  "@ibm/plex-serif": false
  "@parcel/watcher": false
  # inngest (Phase 3 durable-engine SDK): the published package has no install
  # script (only dev release/build). Recorded default-deny as a fail-safe.
  inngest: false
  # openapi-typescript (Phase C boundary-contract codegen, Req 3.2): published
  # scripts are dev/build/publish-time only ("dev"/"build"/"version"/"prepublish"),
  # no install/preinstall/postinstall. Consumed only via the `openapi:gen` mise
  # task to regenerate committed output (no runtime dependency). Recorded
  # default-deny as a fail-safe should a future version add an install script.
  "openapi-typescript": false
  pg: false
  # protobufjs (transitive dep of inngest Connect gateway's protobuf layer):
  # its postinstall only generates the CLI helpers' bundle (pbjs/pbts); the
  # **runtime protobuf works without any script** (inngest Connect's WS messages
  # use the runtime API only). So default-deny (false) is safe — only consider
  # true if the CLI is ever needed.
  protobufjs: false
  # redis (node-redis, Phase 3 JobEvent pub/sub): redis@6.1.0 has no lifecycle
  # build script (published scripts is "release" only; the @redis/* deps are pure
  # JS too). Install is not blocked even under strictDepBuilds, but — like pg —
  # we record default-deny explicitly as a fail-safe should a future version add
  # an install script. (start.ts calls createClient for the real connection;
  # publisher.ts stays import-free behind a structural seam.)
  redis: false
  sharp: false
